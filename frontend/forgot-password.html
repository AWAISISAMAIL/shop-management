<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOHAR TRADERS - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED',
                        secondary: '#A855F7',
                        accent: '#06B6D4',
                        dark: { bg: '#0B1120', surface: '#111827', card: '#1F2937' },
                        muted: '#94A3B8',
                        success: '#10B981',
                        warning: '#F59E0B',
                        error: '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #0B1120 0%, #111827 50%, #0B1120 100%); font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .input-field { width: 100%; background: #111827; border: 1px solid #374151; border-radius: 12px; padding: 12px 16px; color: white; transition: all 0.2s; }
        .input-field:focus { outline: none; border-color: #7C3AED; box-shadow: 0 0 0 3px rgba(124,58,237,0.3); }
        .btn-primary { background: linear-gradient(135deg, #7C3AED, #A855F7); color: white; font-weight: 600; padding: 14px; border-radius: 12px; cursor: pointer; transition: all 0.3s; border: none; }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(124,58,237,0.5); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-outline { background: transparent; border: 1px solid #7C3AED; color: #7C3AED; font-weight: 600; padding: 14px; border-radius: 12px; cursor: pointer; transition: all 0.3s; }
        .btn-outline:hover { background: rgba(124,58,237,0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="glass rounded-3xl p-8 w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-purple-500 to-cyan-400 bg-clip-text text-transparent">GOHAR TRADERS</h1>
            <p class="text-gray-400 mt-2">Reset your password</p>
        </div>

        <div class="flex mb-6 bg-dark-surface rounded-xl p-1" style="background:#111827;">
            <button id="tabEmail" class="flex-1 py-2 rounded-lg text-sm font-medium bg-primary text-white transition-colors">Email Reset</button>
            <button id="tabMaster" class="flex-1 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-colors">Master Key</button>
        </div>

        <div id="emailForm" class="space-y-4">
            <p class="text-sm text-gray-400">Enter your email to receive a reset token.</p>
            <input type="email" id="resetEmail" required class="input-field" placeholder="you@example.com">
            <button id="sendResetBtn" class="btn-primary w-full">Send Reset Token</button>
            <div id="tokenSection" class="hidden space-y-4 mt-4">
                <input type="text" id="resetToken" required class="input-field" placeholder="Enter reset token">
                <input type="password" id="newPassword1" required minlength="6" class="input-field" placeholder="New password (min 6 chars)">
                <button id="confirmResetBtn" class="btn-primary w-full">Reset Password</button>
            </div>
        </div>

        <div id="masterForm" class="hidden space-y-4">
            <p class="text-sm text-gray-400">Use the master key to reset password immediately.</p>
            <input type="email" id="masterEmail" required class="input-field" placeholder="you@example.com">
            <input type="password" id="masterKeyInput" required class="input-field" placeholder="Enter master key">
            <input type="password" id="newPassword2" required minlength="6" class="input-field" placeholder="New password (min 6 chars)">
            <button id="masterResetBtn" class="btn-primary w-full">Reset Password</button>
        </div>

        <div class="mt-6 text-center text-sm text-gray-400">
            <a href="login.html" class="text-purple-400 hover:underline">Back to Login</a>
        </div>
    </div>

    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-gray-800 rounded-2xl p-8 text-center">
            <div class="animate-spin text-4xl mb-4"><i class="fas fa-circle-notch text-purple-500"></i></div>
            <p class="text-white" id="loadingMessage">Processing...</p>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8000';

        const tabEmail = document.getElementById('tabEmail');
        const tabMaster = document.getElementById('tabMaster');
        const emailForm = document.getElementById('emailForm');
        const masterForm = document.getElementById('masterForm');
        tabEmail.addEventListener('click', () => {
            tabEmail.classList.add('bg-primary','text-white');
            tabEmail.classList.remove('text-gray-400');
            tabMaster.classList.remove('bg-primary','text-white');
            tabMaster.classList.add('text-gray-400');
            emailForm.classList.remove('hidden');
            masterForm.classList.add('hidden');
        });
        tabMaster.addEventListener('click', () => {
            tabMaster.classList.add('bg-primary','text-white');
            tabMaster.classList.remove('text-gray-400');
            tabEmail.classList.remove('bg-primary','text-white');
            tabEmail.classList.add('text-gray-400');
            masterForm.classList.remove('hidden');
            emailForm.classList.add('hidden');
        });

        function showLoading(msg) {
            document.getElementById('loadingMessage').textContent = msg || 'Processing...';
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        document.getElementById('sendResetBtn').addEventListener('click', async () => {
            const email = document.getElementById('resetEmail').value;
            if (!email) { showToast('Please enter email', 'warning'); return; }
            showLoading('Sending reset token...');
            try {
                const res = await axios.post(`${API_BASE}/auth/forgot-password`, { email });
                showToast('Reset token generated: ' + res.data.reset_token, 'success');
                document.getElementById('tokenSection').classList.remove('hidden');
            } catch (err) {
                let msg = 'Failed to send reset token.';
                if (err.response?.data?.detail) msg = err.response.data.detail;
                showToast(msg, 'error');
            } finally { hideLoading(); }
        });

        document.getElementById('confirmResetBtn').addEventListener('click', async () => {
            const token = document.getElementById('resetToken').value;
            const newPwd = document.getElementById('newPassword1').value;
            if (!token || !newPwd) { showToast('Fill all fields', 'warning'); return; }
            showLoading('Resetting password...');
            try {
                await axios.post(`${API_BASE}/auth/reset-password`, { token, new_password: newPwd });
                showToast('Password reset successful!', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } catch (err) {
                let msg = 'Reset failed.';
                if (err.response?.data?.detail) msg = err.response.data.detail;
                showToast(msg, 'error');
            } finally { hideLoading(); }
        });

        document.getElementById('masterResetBtn').addEventListener('click', async () => {
            const email = document.getElementById('masterEmail').value;
            const key = document.getElementById('masterKeyInput').value;
            const newPwd = document.getElementById('newPassword2').value;
            if (!email || !key || !newPwd) { showToast('Fill all fields', 'warning'); return; }
            showLoading('Resetting with master key...');
            try {
                await axios.post(`${API_BASE}/auth/master-reset`, { email, master_key: key, new_password: newPwd });
                showToast('Password reset successful!', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } catch (err) {
                let msg = 'Master key reset failed.';
                if (err.response?.data?.detail) msg = err.response.data.detail;
                showToast(msg, 'error');
            } finally { hideLoading(); }
        });
    </script>
</body>
</html>
